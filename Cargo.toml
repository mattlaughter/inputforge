[package]
name = "inputforge"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "Keyboard and mouse remapping, macros, autoclicker and RGB lighting for Linux"
license = "MIT"
repository = "https://github.com/mattlaughter/inputforge"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
evdev = "0.13.2"
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2.189"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
zbus = "5.19.0"
